<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0, user-scalable=no">
    <title>Qerrastar</title>
    <meta name="description" content="Qerrastar is a smart learning platform offering quizzes, PYQs, converters, and study tools for students.">
    <meta name="keywords" content="Qerrastar, Quizzes, PYQ, Study Tools, Smart learning, Pdf to Jpg, Jpg to Pdf, Converter, Summarize, Text shorter">
    <meta name="author" content="Qerrastar">
    <link rel="icon" type="image/png" sizes="512x512" href="{{ url_for('static', filename='images/logo.png') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='images/logo.png') }}">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <script type="application/ld+json">
    {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Qerrastar",
    "url": "https://www.qerrastar.online/"
    }
    </script>
</head>
<body>
    <div class="layer-blur"></div>

    <div class="container">
        <header>
            <h1 data-aos="fade-down" data-aos-duration="1500" class="logo">QERRASTAR</h1>

            <nav>
                <a data-aos="fade-down" data-aos-duration="1500" href="/search">Learn</a>
                <a data-aos="fade-down" data-aos-duration="2000" href="/quiz">Quiz</a>
                <a data-aos="fade-down" data-aos-duration="2500" href="/summary">Summarize</a>
                <a data-aos="fade-down" data-aos-duration="3000" href="/converter">Converter</a>
            </nav>

            <button data-aos="fade-down" data-aos-duration="3000" class="btn-signing" onclick="location.href='/login'">Sign up</button>
        </header>

        <!-- Desktop: Spline robot -->
        <spline-viewer
            class="robot-3d desktop-only"
            url="https://prod.spline.design/zIOWvaKm-VZgFVfc/scene.splinecode">
        </spline-viewer>

        <!-- Mobile: Canvas particle sphere -->
        <canvas id="particleCanvas" class="robot-3d mobile-only"></canvas>

        <main>
            <div class="content">
                <div data-aos="fade-zoom-in"
                    data-aos-easing="ease-in-back"
                    data-aos-delay="300"
                    data-aos-offset="0"
                    data-aos-duration="1500"
                    class="tag-box">
                    <div class="tag">Introducing</div>
                </div>

                <h1 data-aos="fade-zoom-in"
                    data-aos-easing="ease-in-back"
                    data-aos-delay="300"
                    data-aos-offset="0"
                    data-aos-duration="2000">ASSISTANT FOR<br>STUDENTS</h1>

                <p data-aos="fade-zoom-in"
                    data-aos-easing="ease-in-back"
                    data-aos-delay="300"
                    data-aos-offset="0"
                    data-aos-duration="2000"
                    class="description">
                    Qerrastar is a smart learning platform offering Quizzes, PYQs, File Converters, and Study tools for students.
                </p>

                <div data-aos="fade-zoom-in"
                    data-aos-easing="ease-in-back"
                    data-aos-delay="300"
                    data-aos-offset="0"
                    data-aos-duration="2000"
                    class="button">
                    <a href="/docs" class="btn-get-started">Documentation</a>
                    <a href="/dashboard" class="btn-signing-main">Get Started</a>
                </div>
            </div>
        </main>

    </div>

    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.12.48/build/spline-viewer.js"></script>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
      AOS.init();
    </script>
    <script>
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let mouse = { x: null, y: null };
    let particles = [];
    const SPHERE_RADIUS = 100;
    const PARTICLE_COUNT = 500;

    function resize() {
        canvas.width  = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
    }

    class Particle {
        constructor() { this.reset(); }
        reset() {
            // Distribute evenly on sphere surface using spherical coords
            const u = Math.random(), v = Math.random();
            const theta = 2 * Math.PI * u;
            const phi   = Math.acos(2 * v - 1);
            this.sx = Math.sin(phi) * Math.cos(theta); // unit sphere x
            this.sy = Math.sin(phi) * Math.sin(theta); // unit sphere y
            this.sz = Math.cos(phi);                   // unit sphere z
            this.rotX = Math.random() * Math.PI * 2;
            this.rotY = Math.random() * Math.PI * 2;
            this.speedX = (Math.random() - 0.5) * 0.003;
            this.speedY = (Math.random() - 0.5) * 0.003;
            this.size = Math.random() * 1.4 + 0.3;
        }
        update(mx, my) {
            // Slow auto-rotation
            this.rotY += this.speedY + 0.004;
            this.rotX += this.speedX;

            // Mouse/touch tilt
            if (mx !== null) {
                const cx = canvas.width / 2, cy = canvas.height / 2;
                const tiltY = (mx - cx) / cx * 0.015;
                const tiltX = (my - cy) / cy * 0.010;
                this.rotY += tiltY;
                this.rotX += tiltX;
            }

            // Rotate around Y axis
            const cosY = Math.cos(this.rotY), sinY = Math.sin(this.rotY);
            const x1 =  this.sx * cosY + this.sz * sinY;
            const z1 = -this.sx * sinY + this.sz * cosY;
            // Rotate around X axis
            const cosX = Math.cos(this.rotX), sinX = Math.sin(this.rotX);
            const y2 =  this.sy * cosX - z1 * sinX;
            const z2 =  this.sy * sinX + z1 * cosX;

            this.projX = x1;
            this.projY = y2;
            this.projZ = z2; // -1 = back, 1 = front
        }
        draw() {
            const cx = canvas.width / 2, cy = canvas.height / 2;
            const scale = (this.projZ + 1.5) / 2.5; // depth scale
            const x = cx + this.projX * SPHERE_RADIUS;
            const y = cy + this.projY * SPHERE_RADIUS;
            const opacity = scale * 0.75;
            const size = this.size * scale;

            // Purple-white color based on depth
            const r = Math.floor(180 + 60 * scale);
            const g = Math.floor(140 + 40 * scale);
            const b = 255;

            ctx.beginPath();
            ctx.arc(x, y, Math.max(0.2, size), 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${r},${g},${b},${opacity})`;
            ctx.fill();
        }
    }

    function init() {
        resize();
        particles = [];
        for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        // Sort by Z so front particles draw on top
        particles.sort((a, b) => a.projZ - b.projZ);
        particles.forEach(p => { p.update(mouse.x, mouse.y); p.draw(); });
        requestAnimationFrame(animate);
    }

    // Mouse
    canvas.addEventListener('mousemove', e => {
        const r = canvas.getBoundingClientRect();
        mouse.x = e.clientX - r.left;
        mouse.y = e.clientY - r.top;
    });
    canvas.addEventListener('mouseleave', () => { mouse.x = null; mouse.y = null; });

    // Touch
    canvas.addEventListener('touchmove', e => {
        e.preventDefault();
        const r = canvas.getBoundingClientRect();
        mouse.x = e.touches[0].clientX - r.left;
        mouse.y = e.touches[0].clientY - r.top;
    }, { passive: false });
    canvas.addEventListener('touchend', () => { mouse.x = null; mouse.y = null; });

    window.addEventListener('resize', init);
    init();
    animate();
    </script>

</body>
</html>
