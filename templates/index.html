<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0, user-scalable=no">
    <title>Qerrastar</title>
    <meta name="description" content="Qerrastar is a smart learning platform offering quizzes, PYQs, converters, and study tools for students.">
    <meta name="keywords" content="Qerrastar, Quizzes, PYQ, Study Tools, Smart learning, Pdf to Jpg, Jpg to Pdf, Converter, Summarize, Text shorter">
    <meta name="author" content="Qerrastar">
    <link rel="icon" type="image/png" sizes="512x512" href="{{ url_for('static', filename='images/logo.png') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='images/logo.png') }}">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <script type="application/ld+json">
    {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Qerrastar",
    "url": "https://www.qerrastar.online/"
    }
    </script>
</head>
<body>
    <div class="layer-blur"></div>

    <div class="container">
        <header>
            <h1 data-aos="fade-down" data-aos-duration="1500" class="logo">QERRASTAR</h1>

            <nav>
                <a data-aos="fade-down" data-aos-duration="1500" href="/search">Learn</a>
                <a data-aos="fade-down" data-aos-duration="2000" href="/quiz">Quiz</a>
                <a data-aos="fade-down" data-aos-duration="2500" href="/summary">Summarize</a>
                <a data-aos="fade-down" data-aos-duration="3000" href="/converter">Converter</a>
            </nav>

            <button data-aos="fade-down" data-aos-duration="3000" class="btn-signing" onclick="location.href='/login'">Sign up</button>
        </header>

        <!-- Robot here so it sits between header and content on mobile -->
        <canvas id="particleCanvas" class="robot-3d"></canvas>

        <main>
            <div class="content">
                <div data-aos="fade-zoom-in"
                    data-aos-easing="ease-in-back"
                    data-aos-delay="300"
                    data-aos-offset="0"
                    data-aos-duration="1500"
                    class="tag-box">
                    <div class="tag">Introducing</div>
                </div>

                <h1 data-aos="fade-zoom-in"
                    data-aos-easing="ease-in-back"
                    data-aos-delay="300"
                    data-aos-offset="0"
                    data-aos-duration="2000">ASSISTANT FOR<br>STUDENTS</h1>

                <p data-aos="fade-zoom-in"
                    data-aos-easing="ease-in-back"
                    data-aos-delay="300"
                    data-aos-offset="0"
                    data-aos-duration="2000"
                    class="description">
                    Qerrastar is a smart learning platform offering Quizzes, PYQs, File Converters, and Study tools for students.
                </p>

                <div data-aos="fade-zoom-in"
                    data-aos-easing="ease-in-back"
                    data-aos-delay="300"
                    data-aos-offset="0"
                    data-aos-duration="2000"
                    class="button">
                    <a href="/docs" class="btn-get-started">Documentation</a>
                    <a href="/dashboard" class="btn-signing-main">Get Started</a>
                </div>
            </div>
        </main>

    </div>

    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.12.48/build/spline-viewer.js"></script>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
      AOS.init();
    </script>
    <script>
const canvas = document.getElementById('particleCanvas');
const ctx = canvas.getContext('2d');
let mouse = { x: null, y: null };
let particles = [];

function resize() {
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
}

class Particle {
    constructor() { this.reset(); }
    reset() {
        const angle = Math.random() * Math.PI * 2;
        const radius = Math.random() * 100 + 20;
        const cx = canvas.width / 2, cy = canvas.height / 2;
        this.x = cx + Math.cos(angle) * radius;
        this.y = cy + Math.sin(angle) * radius;
        this.baseX = this.x;
        this.baseY = this.y;
        this.size = Math.random() * 1.5 + 0.3;
        this.speed = Math.random() * 0.4 + 0.1;
        this.angle = angle;
        this.radius = radius;
        this.opacity = Math.random() * 0.6 + 0.2;
    }
    update() {
        this.angle += this.speed * 0.008;
        const cx = canvas.width / 2, cy = canvas.height / 2;
        this.baseX = cx + Math.cos(this.angle) * this.radius;
        this.baseY = cy + Math.sin(this.angle) * this.radius;

        if (mouse.x !== null) {
            const dx = mouse.x - this.baseX;
            const dy = mouse.y - this.baseY;
            const dist = Math.sqrt(dx*dx + dy*dy);
            const force = Math.max(0, 80 - dist) / 80;
            this.x = this.baseX - dx * force * 0.4;
            this.y = this.baseY - dy * force * 0.4;
        } else {
            this.x += (this.baseX - this.x) * 0.05;
            this.y += (this.baseY - this.y) * 0.05;
        }
    }
    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(220, 200, 255, ${this.opacity})`;
        ctx.fill();
    }
}

function init() {
    resize();
    particles = [];
    for (let i = 0; i < 320; i++) particles.push(new Particle());
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => { p.update(); p.draw(); });
    requestAnimationFrame(animate);
}

// Mouse
canvas.addEventListener('mousemove', e => {
    const r = canvas.getBoundingClientRect();
    mouse.x = e.clientX - r.left;
    mouse.y = e.clientY - r.top;
});
canvas.addEventListener('mouseleave', () => { mouse.x = null; mouse.y = null; });

// Touch
canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    const r = canvas.getBoundingClientRect();
    mouse.x = e.touches[0].clientX - r.left;
    mouse.y = e.touches[0].clientY - r.top;
}, { passive: false });
canvas.addEventListener('touchend', () => { mouse.x = null; mouse.y = null; });

window.addEventListener('resize', init);
init();
animate();
</script>

</body>
</html>
